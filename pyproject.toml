[project]
name = "codex-team-board"
version = "0.5.0"
description = "Local task graph, worktree coordinator, MCP server, and dashboard for Codex teams"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
authors = [
    { name = "RSmfOffice" },
]

[project.urls]
Homepage = "https://github.com/RSmfOffice/codex-team-board"
Releases = "https://github.com/RSmfOffice/codex-team-board/releases"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
teamctl = "codex_team.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
