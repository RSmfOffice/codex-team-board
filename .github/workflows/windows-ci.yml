name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        shell: powershell
        run: |
          $env:PYTHONPATH = ".\src"
          python -m py_compile .\src\codex_team\*.py
          python -m unittest discover -s tests -v

      - name: Build release package
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\build-release.ps1
